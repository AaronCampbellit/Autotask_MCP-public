name: Verify local implementation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify compiled offline preflight entry point
        run: node --check work/build/scripts/preflight.js
      - name: Validate Compose without displaying interpolated secrets
        env:
          POSTGRES_BOOTSTRAP_PASSWORD: fixture-ci-only
          MIGRATION_DATABASE_URL: postgresql://migration:fixture-ci-only@postgres/autotask_mcp
          DATABASE_URL: postgresql://runtime:fixture-ci-only@postgres/autotask_mcp
          PUBLIC_URL: https://mcp.example.invalid
          ENTRA_TENANT_ID: 11111111-1111-4111-8111-111111111111
          ENTRA_AUDIENCE: fixture-ci-only
          AUTOTASK_BASE_URL: https://webservices1.autotask.net/atservicesrest/v1.0/
          AUTOTASK_USERNAME: fixture-ci-only
          AUTOTASK_SECRET: fixture-ci-only
          AUTOTASK_INTEGRATION_CODE: fixture-ci-only
          CURSOR_SECRET: fixture-ci-only
          OPERATION_PAYLOAD_KEY: fixture-ci-only
          ARTIFACT_ENCRYPTION_KEY: fixture-ci-only
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build container candidate without publishing or deploying
        run: docker build --file deploy/Dockerfile --tag rarity-autotask-mcp:ci .
